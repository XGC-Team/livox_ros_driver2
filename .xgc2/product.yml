schema: xgc2.product.v1
id: livox-ros-driver2
name: Livox ROS Driver 2
version: 1.2.6-7
kind: ros1-apt
summary: ROS1 Noetic package for Livox ROS Driver 2.
ros:
  distro: noetic
  packages:
  - livox_ros_driver2
apt:
  distribution: focal
  install:
  - ros-noetic-livox-ros-driver2
  packages:
  - ros-noetic-livox-ros-driver2
usage:
  install: 'sudo apt update

    sudo apt install ros-noetic-livox-ros-driver2

    '
  smoke_test: 'rospack find livox_ros_driver2

    '
ownership:
  paths:
  - /opt/ros/noetic/share/livox_ros_driver2
  - /opt/ros/noetic/include/livox_ros_driver2
  - /opt/ros/noetic/lib/livox_ros_driver2
